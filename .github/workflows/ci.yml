name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '24'

jobs:
  frontend:
    name: Frontend (format, lint, typecheck, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  rust:
    name: Rust ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
          - name: Linux
            os: ubuntu-24.04
          - name: macOS (arm64)
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config

      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - name: Show Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # tauri::generate_context! embeds the built frontend, so dist/ must exist.
      - run: npx vite build

      - name: cargo fmt
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  # Real OpenSSH instead of the in-process test server: throw-away container,
  # throw-away password, only reachable from the runner.
  openssh:
    name: Real OpenSSH server (Docker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file             libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - name: Show Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Start OpenSSH server container
        run: |
          PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$PASS"
          echo "PEACHTERM_TEST_OPENSSH=2222:tester:$PASS" >> "$GITHUB_ENV"
          docker run -d --name sshd -p 127.0.0.1:2222:2222             -e PUID=1000 -e PGID=1000 -e USER_NAME=tester -e USER_PASSWORD="$PASS"             -e PASSWORD_ACCESS=true lscr.io/linuxserver/openssh-server:latest
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/2222) 2>/dev/null; then break; fi
            sleep 1
          done
          sleep 5
      - name: Terminal, SFTP and editor round trip against OpenSSH
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked -- --ignored openssh_terminal_sftp_and_editor_round_trip openssh_monitor_reads_proc_over_an_exec_channel --nocapture
      - name: Container log on failure
        if: failure()
        run: docker logs sshd | tail -50

  build:
    name: App build ${{ matrix.name }}
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            args: ''
            artifact: src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux x64
            os: ubuntu-24.04
            args: '--bundles deb,appimage'
            artifact: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - name: macOS arm64
            os: macos-15
            args: '--target aarch64-apple-darwin --bundles app,dmg'
            artifact: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macOS x64
            os: macos-15
            args: '--target x86_64-apple-darwin --bundles app,dmg'
            artifact: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Unsigned development builds. Signing/notarisation is configured later.
      - run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        with:
          name: peachterm-${{ runner.os }}-${{ strategy.job-index }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
